# Фрагмент для nginx на lognet.by.
# Вставьте внутрь server { ... } сайта lognet.by.
# Важно: location /ota/ должен обрабатываться РАНЬШЕ catch-all Next.js.

location ^~ /ota/ {
    alias /var/www/lognet.by/ota/;   # поправьте путь, если у вас другой document root
    autoindex off;
    default_type application/octet-stream;

    location ~* \.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* \.zip$ {
        default_type application/zip;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    try_files $uri =404;
}
